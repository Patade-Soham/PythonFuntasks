{% extends "base.html" %}
{% block content %}
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="flex items-end justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold">Verified Vendors & Experts</h1>
      <p class="text-slate-600">KYC-verified partners across India with transparent reviews.</p>
    </div>
    <form class="flex gap-2">
      <input class="border rounded-lg p-2" type="text" name="q" value="{{ request.args.get('q','') }}" placeholder="Search vendors">
      <input class="border rounded-lg p-2" type="text" name="city" value="{{ request.args.get('city','') }}" placeholder="City">
      <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg">Filter</button>
    </form>
  </div>

  <div class="grid md:grid-cols-3 gap-6 mt-8">
    {% for v in items %}
    <a href="{{ url_for('vendor_detail', vid=v.id) }}" class="p-5 rounded-2xl border bg-white block hover:shadow-lg transition">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center">{{ v.name[:2] }}</div>
        <div>
          <div class="font-semibold">{{ v.name }}</div>
          <div class="text-xs text-slate-500">{{ v.city }} • {{ v.rating }}★</div>
        </div>
      </div>
      <p class="text-sm text-slate-600 mt-3 line-clamp-2">{{ v.bio }}</p>
    </a>
    {% else %}
    <div class="col-span-3 text-slate-500">No vendors match.</div>
    {% endfor %}
  </div>
</section>
{% endblock %}
