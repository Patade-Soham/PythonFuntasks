{% extends "base.html" %}
{% block content %}
<section class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <h1 class="text-3xl font-bold">Checkout (Prototype)</h1>
  <form method="post" class="mt-6 space-y-3">
    <input class="w-full border rounded-lg p-3" placeholder="Company / Institute Name">
    <input class="w-full border rounded-lg p-3" placeholder="Email">
    <input class="w-full border rounded-lg p-3" placeholder="Phone">
    <button class="w-full py-3 rounded-xl bg-indigo-600 text-white">Pay via Escrow (Demo)</button>
  </form>
</section>
{% endblock %}
