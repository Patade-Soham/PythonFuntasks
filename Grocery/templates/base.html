<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FreshCart | Online Grocery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style> body{font-family:'Inter',sans-serif;} </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
      <a href="{{ url_for('shop') }}" class="text-3xl font-extrabold text-green-600">Fresh<span class="text-gray-800">Cart</span></a>
      <nav class="space-x-4">
        <a href="{{ url_for('shop') }}" class="text-gray-600 hover:text-gray-800 font-medium">Shop</a>
        <a href="{{ url_for('cart_view') }}" class="relative text-gray-600 hover:text-gray-800 font-medium">
          <!-- Cart icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="inline-block w-6 h-6" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
          {% if total_items and total_items > 0 %}
          <span class="absolute top-0 right-0 transform translate-x-1/2 -translate-y-1/2 bg-red-500 text-white text-xs font-bold rounded-full px-2 py-1">
            {{ total_items }}
          </span>
          {% endif %}
        </a>
      </nav>
    </div>
  </header>

  <!-- Flash messages -->
  <div class="max-w-3xl mx-auto mt-4 w-full px-4">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% if msgs %}
        {% for cat, msg in msgs %}
          <div class="mb-2 px-4 py-3 rounded-xl shadow {{ 'bg-green-100 text-green-800' if cat=='success' else 'bg-red-100 text-red-800' }}">
            {{ msg }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <!-- Main -->
  <main class="flex-1 container mx-auto p-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center text-gray-500 py-6">
    © {{ 2025 }} FreshCart
  </footer>
</body>
</html>
