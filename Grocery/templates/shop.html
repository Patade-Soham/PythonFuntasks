{% extends "base.html" %}
{% block content %}

<!-- Category Filter -->
<div class="mb-6 flex justify-center flex-wrap gap-2">
  {% for c in categories %}
  <a href="{{ url_for('shop', category=c) }}"
     class="px-4 py-2 rounded-full font-semibold transition-colors duration-300
            {{ 'bg-green-600 text-white shadow-md' if selected_category==c else 'bg-white text-gray-700 hover:bg-gray-200' }}">
     {{ c }}
  </a>
  {% endfor %}
</div>

<!-- Products Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
  {% for p in products %}
  <div class="bg-white p-4 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300">
    <img src="{{ p.image }}" alt="{{ p.name }}" class="w-full h-32 object-contain mb-4 rounded-lg bg-gray-50" />
    <h3 class="text-xl font-bold text-gray-800">{{ p.name }}</h3>
    <p class="text-gray-600 font-medium">${{ '%.2f'|format(p.price) }}</p>
    <form action="{{ url_for('add_to_cart') }}" method="post" class="mt-4">
      <input type="hidden" name="product_id" value="{{ p.id }}">
      <button type="submit" class="w-full bg-green-500 text-white font-semibold py-2 rounded-lg hover:bg-green-600 transition-colors">
        Add to Cart
      </button>
    </form>
  </div>
  {% endfor %}
</div>

{% endblock %}
