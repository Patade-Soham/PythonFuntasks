{% extends "base.html" %}
{% block content %}
<div class="bg-white p-8 rounded-xl shadow-lg max-w-md mx-auto my-16 text-center">
  <!-- CheckCircle icon -->
  <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  </svg>

  <h2 class="text-3xl font-bold text-gray-800 mb-2">Order Confirmed!</h2>
  <p class="text-gray-600 mb-6">
    Thank you for your purchase. Your order totaling
    <span class="font-semibold text-green-600">${{ '%.2f'|format(total) }}</span>
    has been placed successfully.
  </p>
  <a href="{{ url_for('shop') }}" class="w-full inline-block bg-green-500 text-white font-semibold py-3 rounded-xl hover:bg-green-600 transition-colors shadow-md">
    Start a New Order
  </a>
</div>
{% endblock %}
